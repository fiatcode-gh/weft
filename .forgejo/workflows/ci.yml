name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vet-and-test:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install ripgrep
        # peekseq shells out to rg at runtime; tests exercise that path.
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify
        run: |
          go vet ./...
          go test -race ./...
          go build ./...
